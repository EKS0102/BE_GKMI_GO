      tags:
      - Jemaat
  /api/jemaat/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Jemaat data list
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/model.CreateJemaatRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/model.Jemaat'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
