      consumes:
      - application/json
      parameters:
      - description: Jemaat ID
        in: path
        name: id
        required: true
        type: integer
      - description: Jemaat data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateJemaatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Jemaat'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
